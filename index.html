<!DOCTYPE html>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            setPersistence, 
            browserLocalPersistence, 
            onAuthStateChanged, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithRedirect, 
            getRedirectResult, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc,
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.db = null;
        window.auth = null;
        window.currentUser = null;

        window.GoogleAuthProviderClass = GoogleAuthProvider;
        window.signInWithPopupFunc = signInWithPopup;
        window.signInWithRedirectFunc = signInWithRedirect;
        window.signOutFunc = signOut;
        window.doc = doc;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;

        const firebaseConfig = {
            apiKey: "AIzaSyD50XJN4WQTzLyqlR-7pIXzLBBduxZxIwQ",
            authDomain: "sanjo-app-ec596.firebaseapp.com",
            projectId: "sanjo-app-ec596",
            storageBucket: "sanjo-app-ec596.firebasestorage.app",
            messagingSenderId: "493721911930",
            appId: "1:493721911930:web:971f61b1d43b4432d0b1c3",
            measurementId: "G-N5YG2NBERK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);

            setPersistence(window.auth, browserLocalPersistence).catch(console.error);

            getRedirectResult(window.auth).then((result) => {
                if (result && result.user && window.onGoogleSignInSuccess) {
                    window.onGoogleSignInSuccess(result.user);
                }
            }).catch((err) => {
                console.warn("Redirect result handler error:", err);
            });

            onAuthStateChanged(window.auth, (user) => {
                if (user && !user.isAnonymous) {
                    window.currentUser = user;
                    if (window.onGoogleSignInSuccess) window.onGoogleSignInSuccess(user);
                } else {
                    window.currentUser = null;
                    if (window.onSignOutSuccess) window.onSignOutSuccess();
                }
            });

            const q = query(collection(window.db, "questions"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                window.questions = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));
                if (window.renderQuestions) window.renderQuestions();
            }, (error) => {
                console.warn("Firestore subscription notice:", error);
            });

        } catch (err) {
            console.warn("Firebase init notice:", err);
        }
    </script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }

    <script>
        const CATEGORIES = [
            { id: 'all', name: 'すべてのカテゴリー', icon: 'fa-layer-group' },
            { id: '数学', name: '数学', icon: 'fa-calculator' },
            { id: '英語', name: '英語', icon: 'fa-language' },
            { id: '国語', name: '国語', icon: 'fa-book-open' },
            { id: '理科', name: '理科', icon: 'fa-flask' },
            { id: '社会', name: '社会', icon: 'fa-earth-asia' },
            { id: '学校生活・進路', name: '学校生活・進路', icon: 'fa-school' },
            { id: '部活動', name: '部活動', icon: 'fa-baseball-bat-ball' }
        ];

        const PRESET_AVATARS = [
            "https://api.dicebear.com/7.x/bottts/svg?seed=Student1",
            "https://api.dicebear.com/7.x/avataaars/svg?seed=Sakura",
            "https://api.dicebear.com/7.x/avataaars/svg?seed=Ken",
            "https://api.dicebear.com/7.x/avataaars/svg?seed=Misa",
            "https://api.dicebear.com/7.x/bottts/svg?seed=Anonymous",
            "https://api.dicebear.com/7.x/fun-emoji/svg?seed=Study"
        ];

        let selectedCategory = 'all';
        let searchQuery = '';
        let tempAvatarUrl = '';

        let userProfile = {
            id: '',
            name: "三条生",
            email: "",
            avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Student1",
            isAnonymous: false,
            hasCustomProfile: false
        };

        window.questions = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            renderCategories();
            renderPresetAvatars();
            renderQuestions();
            renderGoogleAccountStatus();
            updateNavAvatar();
        });

        function renderCategories() {
            const list = document.getElementById('category-list');
            const mobileList = document.getElementById('mobile-category-list');

            if (list) {
                list.innerHTML = CATEGORIES.map(c => `
                    <button onclick="selectCategory('${c.id}')" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs font-bold transition-all ${selectedCategory === c.id ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-100'}">
                        <i class="fa-solid ${c.icon} w-4 text-center"></i>
                        <span>${c.name}</span>
                    </button>
                `).join('');
            }
            if (mobileList) {
                mobileList.innerHTML = CATEGORIES.map(c => `
                    <button onclick="selectCategory('${c.id}')" class="whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${selectedCategory === c.id ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
                        ${c.name}
                    </button>
                `).join('');
            }
        }

        function renderPresetAvatars() {
            const grid = document.getElementById('preset-avatars-grid');
            if (!grid) return;
            grid.innerHTML = PRESET_AVATARS.map(url => `
                <button type="button" onclick="selectPresetAvatar('${url}')" class="p-1 rounded-full border-2 border-transparent hover:border-brand-500 focus:border-brand-600 transition-all bg-slate-50">
                    <img src="${url}" alt="preset" class="w-10 h-10 rounded-full mx-auto object-cover">
                </button>
            `).join('');
        }

        function selectPresetAvatar(url) {
            tempAvatarUrl = url;
            document.getElementById('modal-avatar-preview').src = url;
        }

        function handleAvatarFileChange(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 160;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    tempAvatarUrl = compressedDataUrl;
                    document.getElementById('modal-avatar-preview').src = compressedDataUrl;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function toggleAnonymousInput(isAnon) {
            const nameInput = document.getElementById('profile-name-input');
            if (isAnon) {
                nameInput.disabled = true;
                tempAvatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=Anonymous";
                document.getElementById('modal-avatar-preview').src = tempAvatarUrl;
            } else {
                nameInput.disabled = false;
            }
        }

        function getEffectiveDisplayName() {
            return userProfile.isAnonymous ? "匿名" : (userProfile.name || "三条生");
        }

        function getEffectiveAvatar() {
            return userProfile.isAnonymous
                ? "https://api.dicebear.com/7.x/bottts/svg?seed=Anonymous"
                : (userProfile.avatarUrl || "https://api.dicebear.com/7.x/bottts/svg?seed=Student1");
        }

        function updateNavAvatar() {
            const navImg = document.getElementById('nav-avatar');
            if (navImg) {
                navImg.src = userProfile.email ? getEffectiveAvatar() : "https://api.dicebear.com/7.x/bottts/svg?seed=Guest";
            }
        }

        function openProfileModal() {
            tempAvatarUrl = userProfile.avatarUrl;
            document.getElementById('modal-avatar-preview').src = getEffectiveAvatar();
            document.getElementById('profile-name-input').value = userProfile.name || "三条生";
            const anonToggle = document.getElementById('profile-anonymous-toggle');
            anonToggle.checked = !!userProfile.isAnonymous;
            document.getElementById('profile-name-input').disabled = !!userProfile.isAnonymous;

            renderGoogleAccountStatus();
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function saveProfileSettings(e) {
            e.preventDefault();
            const isAnon = document.getElementById('profile-anonymous-toggle').checked;
            const newName = document.getElementById('profile-name-input').value.trim();

            userProfile.isAnonymous = isAnon;
            if (!isAnon && newName) {
                userProfile.name = newName;
            }
            if (tempAvatarUrl) {
                userProfile.avatarUrl = tempAvatarUrl;
            }
            userProfile.hasCustomProfile = true;

            saveUserProfile();
            updateNavAvatar();
            closeProfileModal();
            showToast(isAnon ? '匿名モードに設定しました' : 'プロフィールを保存しました！', 'success');
        }

        function selectCategory(id) {
            selectedCategory = id;
            renderCategories();
            renderQuestions();
        }

        function handleSearch(e) {
            searchQuery = e.target.value.toLowerCase();
            renderQuestions();
        }

        window.renderQuestions = function() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            let filtered = selectedCategory === 'all' 
                ? window.questions 
                : window.questions.filter(q => q.category === selectedCategory);

            if (searchQuery) {
                filtered = filtered.filter(q => 
                    (q.title || '').toLowerCase().includes(searchQuery) || 
                    (q.body || '').toLowerCase().includes(searchQuery)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-sm border border-slate-200">質問が見つかりませんでした。</div>';
                return;
            }

            container.innerHTML = filtered.map(q => {
                const isLiked = userProfile.email && q.likedUsers && q.likedUsers.includes(userProfile.email);
                const isAuthor = userProfile.email && q.authorEmail === userProfile.email;
                const answersList = q.answers || [];
                const authorAvatar = q.authorAvatar || "https://api.dicebear.com/7.x/bottts/svg?seed=Student1";

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center gap-2.5">
                                <img src="${escapeHtml(authorAvatar)}" alt="avatar" class="w-7 h-7 rounded-full object-cover border border-slate-200 bg-slate-50">
                                <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-md font-semibold">${escapeHtml(q.category || '全般')}</span>
                                <span class="text-xs font-bold text-slate-600">${escapeHtml(q.author || '匿名')}</span>
                            </div>
                            ${isAuthor ? `
                                <div class="flex items-center gap-1.5">
                                    <button onclick="openEditModal('${q.id}')" class="text-xs text-brand-600 hover:text-brand-800 font-bold px-2.5 py-1 bg-brand-50 rounded-lg transition-colors">
                                        <i class="fa-solid fa-pen-to-square mr-1"></i>編集
                                    </button>
                                    <button onclick="deleteQuestion('${q.id}')" class="text-xs text-red-600 hover:text-red-800 font-bold px-2.5 py-1 bg-red-50 rounded-lg transition-colors">
                                        <i class="fa-solid fa-trash-can mr-1"></i>削除
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        
                        <h3 class="font-bold text-slate-800 text-lg">${escapeHtml(q.title || '')}</h3>
                        <p class="text-slate-600 text-sm whitespace-pre-line">${escapeHtml(q.body || '')}</p>
                        
                        <div class="pt-2 flex items-center justify-between border-t border-slate-100">
                            <button onclick="toggleLike('${q.id}')" class="flex items-center gap-1.5 text-xs font-bold ${isLiked ? 'text-pink-500' : 'text-slate-400 hover:text-slate-600'} transition-colors">
                                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart text-sm"></i>
                                <span>${q.likes || 0}</span>
                            </button>
                            <span class="text-xs text-slate-400 font-medium">${answersList.length} 件の回答</span>
                        </div>

                        <!-- Answers Section -->
                        <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                            <h4 class="text-xs font-bold text-slate-500">回答一覧 (${answersList.length})</h4>
                            
                            ${answersList.length === 0 ? `
                                <p class="text-xs text-slate-400 py-1">まだ回答はありません。最初の回答を書いてみましょう！</p>
                            ` : `
                                <div class="space-y-2">
                                    ${answersList.map(a => {
                                        const isAnswerAuthor = userProfile.email && a.authorEmail === userProfile.email;
                                        const ansAvatar = a.authorAvatar || "https://api.dicebear.com/7.x/bottts/svg?seed=Student1";
                                        return `
                                            <div class="bg-white p-3 rounded-lg border border-slate-200 space-y-1.5">
                                                <div class="flex items-center justify-between">
                                                    <div class="flex items-center gap-2">
                                                        <img src="${escapeHtml(ansAvatar)}" alt="avatar" class="w-5 h-5 rounded-full object-cover border border-slate-200">
                                                        <span class="text-xs font-bold text-slate-700">${escapeHtml(a.author || '匿名')}</span>
                                                    </div>
                                                    ${isAnswerAuthor ? `
                                                        <button onclick="deleteAnswer('${q.id}', '${a.id}')" class="text-[11px] text-slate-400 hover:text-red-500 transition-colors" title="回答を削除">
                                                            <i class="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    ` : ''}
                                                </div>
                                                <p class="text-xs text-slate-600 whitespace-pre-line">${escapeHtml(a.body || '')}</p>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `}

                            <!-- Answer Form -->
                            <form onsubmit="submitAnswer(event, '${q.id}')" class="flex gap-2 pt-2">
                                <input type="text" id="answer-input-${q.id}" required placeholder="${userProfile.isAnonymous ? '匿名で回答を入力...' : '回答を入力...'}" class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-brand-500">
                                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-3 py-2 rounded-xl text-xs shadow-sm transition-all">回答する</button>
                            </form>
                        </div>
                    </div>
                `;
            }).join('');
        };

        async function deleteQuestion(questionId) {
            if (!confirm('この質問を削除してもよろしいですか？（元に戻せません）')) return;

            if (window.db && window.deleteDoc) {
                try {
                    const docRef = window.doc(window.db, "questions", questionId);
                    await window.deleteDoc(docRef);
                    showToast('質問を削除しました', 'info');
                } catch (err) {
                    console.error("Delete question error:", err);
                    showToast('削除に失敗しました: ' + err.message, 'error');
                }
            }
        }

        async function deleteAnswer(questionId, answerId) {
            if (!confirm('この回答を削除しますか？')) return;

            const q = window.questions.find(item => item.id === questionId);
            if (!q || !q.answers) return;

            const updatedAnswers = q.answers.filter(a => String(a.id) !== String(answerId));

            if (window.db && window.updateDoc) {
                try {
                    const docRef = window.doc(window.db, "questions", questionId);
                    await window.updateDoc(docRef, {
                        answers: updatedAnswers
                    });
                    showToast('回答を削除しました', 'info');
                } catch (err) {
                    console.error("Delete answer error:", err);
                    showToast('回答の削除に失敗しました', 'error');
                }
            }
        }

        async function submitAnswer(e, questionId) {
            e.preventDefault();
            if (!userProfile.email) {
                document.getElementById('auth-overlay').classList.remove('hidden');
                return;
            }

            const input = document.getElementById(`answer-input-${questionId}`);
            if (!input) return;

            const text = input.value.trim();
            if (!text) return;

            const q = window.questions.find(item => item.id === questionId);
            if (!q) return;

            const currentAnswers = q.answers ? [...q.answers] : [];
            currentAnswers.push({
                id: String(Date.now()),
                author: getEffectiveDisplayName(),
                authorAvatar: getEffectiveAvatar(),
                authorEmail: userProfile.email,
                body: text,
                createdAt: Date.now()
            });

            if (window.db) {
                try {
                    const docRef = window.doc(window.db, "questions", questionId);
                    await window.updateDoc(docRef, {
                        answers: currentAnswers
                    });
                    input.value = '';
                    showToast('回答を投稿しました！', 'success');
                } catch (err) {
                    console.error("Answer submission error:", err);
                    showToast('回答の送信に失敗しました', 'error');
                }
            }
        }

        async function toggleLike(id) {
            if (!userProfile.email) {
                document.getElementById('auth-overlay').classList.remove('hidden');
                return;
            }
            const q = window.questions.find(item => item.id === id);
            if (!q) return;

            let likedUsers = q.likedUsers ? [...q.likedUsers] : [];
            const index = likedUsers.indexOf(userProfile.email);
            let newLikes = q.likes || 0;

            if (index > -1) {
                likedUsers.splice(index, 1);
                newLikes = Math.max(0, newLikes - 1);
            } else {
                likedUsers.push(userProfile.email);
                newLikes += 1;
            }

            if (window.db) {
                try {
                    const docRef = window.doc(window.db, "questions", id);
                    await window.updateDoc(docRef, {
                        likes: newLikes,
                        likedUsers: likedUsers
                    });
                } catch (e) {
                    console.error("Firestore update like error:", e);
                }
            }
        }

        function handleAskClick() {
            if (userProfile.email) {
                document.getElementById('edit-question-id').value = '';
                document.getElementById('modal-form-title').textContent = userProfile.isAnonymous ? '質問を投稿する（匿名モード）' : '質問を投稿する';
                document.getElementById('question-title').value = '';
                document.getElementById('question-body').value = '';
                document.getElementById('ask-modal').classList.remove('hidden');
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        }

        function openEditModal(id) {
            const q = window.questions.find(item => item.id === id);
            if (!q) return;

            document.getElementById('edit-question-id').value = q.id;
            document.getElementById('modal-form-title').textContent = '質問を編集する';
            document.getElementById('question-category').value = q.category || '数学';
            document.getElementById('question-title').value = q.title || '';
            document.getElementById('question-body').value = q.body || '';
            document.getElementById('ask-modal').classList.remove('hidden');
        }

        async function submitQuestion(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-question-id').value;
            const category = document.getElementById('question-category').value;
            const title = document.getElementById('question-title').value.trim();
            const body = document.getElementById('question-body').value.trim();

            if (!title || !body) return;

            if (window.db) {
                try {
                    if (editId) {
                        const docRef = window.doc(window.db, "questions", editId);
                        await window.updateDoc(docRef, {
                            category: category,
                            title: title,
                            body: body
                        });
                        showToast('質問を更新しました！', 'success');
                    } else {
                        await window.addDoc(window.collection(window.db, "questions"), {
                            author: getEffectiveDisplayName(),
                            authorAvatar: getEffectiveAvatar(),
                            authorEmail: userProfile.email,
                            category: category,
                            title: title,
                            body: body,
                            likes: 0,
                            likedUsers: [],
                            answers: [],
                            createdAt: Date.now()
                        });
                        showToast('質問を投稿しました！', 'success');
                    }
                } catch (err) {
                    console.error("Firestore submit error:", err);
                    showToast('保存エラー: ' + err.message, 'error');
                }
            }

            closeAskModal();
        }

        function closeAuthModal() { document.getElementById('auth-overlay').classList.add('hidden'); }
        function closeAskModal() { document.getElementById('ask-modal').classList.add('hidden'); }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function loadUserProfile() {
            const saved = localStorage.getItem('chiebukuro_user_profile');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') userProfile = { ...userProfile, ...parsed };
                } catch (e) {}
            }
        }

        function saveUserProfile() {
            localStorage.setItem('chiebukuro_user_profile', JSON.stringify(userProfile));
        }

        window.signInWithGoogle = async function() {
            try {
                if (window.auth && window.GoogleAuthProviderClass) {
                    const provider = new window.GoogleAuthProviderClass();
                    try {
                        await window.signInWithPopupFunc(window.auth, provider);
                    } catch (err) {
                        await window.signInWithRedirectFunc(window.auth, provider);
                    }
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        };

        window.signOutAccount = async function() {
            if (window.auth && window.signOutFunc) {
                await window.signOutFunc(window.auth);
                window.onSignOutSuccess();
            }
        };

        window.onGoogleSignInSuccess = function(user) {
            userProfile.email = user.email || "";
            if (!userProfile.hasCustomProfile) {
                if (user.displayName) userProfile.name = user.displayName;
                if (user.photoURL) userProfile.avatarUrl = user.photoURL;
            }

            saveUserProfile();
            document.getElementById('auth-overlay').classList.add('hidden');
            updateNavAvatar();
            document.getElementById('nav-auth-badge').className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full";
            renderGoogleAccountStatus();
            renderQuestions();
        };

        window.onSignOutSuccess = function() {
            userProfile.email = "";
            saveUserProfile();
            updateNavAvatar();
            document.getElementById('nav-auth-badge').className = "absolute bottom-0 right-0 w-3 h-3 bg-slate-400 border-2 border-white rounded-full";
            renderGoogleAccountStatus();
            renderQuestions();
        };

        function renderGoogleAccountStatus() {
            const container = document.getElementById('google-account-status');
            if (!container) return;

            if (userProfile.email) {
                container.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-emerald-700 flex items-center gap-1">
                                <i class="fa-solid fa-circle-check"></i> Google連携中
                            </div>
                            <div class="text-[11px] text-slate-500">${escapeHtml(userProfile.email)}</div>
                        </div>
                        <button type="button" onclick="window.signOutAccount()" class="px-3 py-1.5 bg-slate-200 text-xs font-bold rounded-xl hover:bg-slate-300">ログアウト</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-slate-800">未サインイン</div>
                            <div class="text-[11px] text-slate-500">Googleアカウントでログイン</div>
                        </div>
                        <button type="button" onclick="window.signInWithGoogle()" class="flex items-center space-x-2 px-3.5 py-2 bg-white border text-xs font-bold rounded-xl hover:bg-slate-50">
                            <i class="fa-brands fa-google text-red-500"></i>
                            <span>ログイン</span>
                        </button>
                    </div>
                `;
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl text-xs font-bold text-white shadow-lg pointer-events-auto transition-all transform translate-y-2 ${type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-slate-700'}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校生知恵袋 - スチュディ・コミュニティ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        sakura: {
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.db = null;
        window.auth = null;
        window.currentUser = null;

        window.GoogleAuthProviderClass = GoogleAuthProvider;
        window.signInWithPopupFunc = signInWithPopup;
        window.signInWithRedirectFunc = signInWithRedirect;
        window.signOutFunc = signOut;

        const firebaseConfig = {
            apiKey: "AIzaSyD50XJN4WQTzLyqlR-7pIXzLBBduxZxIwQ",
            authDomain: "sanjo-app-ec596.firebaseapp.com",
            projectId: "sanjo-app-ec596",
            storageBucket: "sanjo-app-ec596.firebasestorage.app",
            messagingSenderId: "493721911930",
            appId: "1:493721911930:web:971f61b1d43b4432d0b1c3",
            measurementId: "G-N5YG2NBERK"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);

            getRedirectResult(window.auth).then((result) => {
                if (result && result.user && window.onGoogleSignInSuccess) {
                    window.onGoogleSignInSuccess(result.user);
                }
            }).catch((err) => {
                console.warn("Redirect result handler error:", err);
            });

            onAuthStateChanged(window.auth, (user) => {
                if (user && !user.isAnonymous) {
                    window.currentUser = user;
                    if (window.onGoogleSignInSuccess) window.onGoogleSignInSuccess(user);
                } else {
                    window.currentUser = null;
                    if (window.onSignOutSuccess) window.onSignOutSuccess();
                }
            });

            // Listen to live global Firestore collection
            const q = query(collection(window.db, "questions"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                window.questions = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));
                if (window.renderQuestions) window.renderQuestions();
            }, (error) => {
                console.warn("Firestore subscription notice:", error);
            });

        } catch (err) {
            console.warn("Firebase init notice:", err);
        }
    </script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans JP', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .glass-effect { backdrop-filter: blur(8px); background-color: rgba(255, 255, 255, 0.85); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Auth Prompt Modal -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-100 text-center space-y-6 relative">
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-tr from-brand-600 to-sakura-500 flex items-center justify-center text-white font-black text-3xl shadow-lg">知</div>
            <div>
                <h2 class="text-2xl font-black bg-gradient-to-r from-brand-600 to-sakura-500 bg-clip-text text-transparent">高校生知恵袋</h2>
                <p class="text-xs text-slate-500 font-medium mt-1">高校生のための学習＆学校生活Q&Aコミュニティ</p>
            </div>
            <div class="bg-brand-50/60 p-4 rounded-2xl border border-brand-100 text-left space-y-2">
                <div class="text-xs font-bold text-brand-700 flex items-center space-x-1.5">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>ログインが必要です</span>
                </div>
                <p class="text-[11px] text-slate-600 leading-relaxed">質問の投稿や「いいね！」を行うにはGoogleアカウントでのログインが必要です。</p>
            </div>
            <button onclick="window.signInWithGoogle()" class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-brand-500 text-slate-700 font-bold text-sm rounded-2xl shadow-md flex items-center justify-center space-x-3 transition-all">
                <i class="fa-brands fa-google text-red-500 text-lg"></i>
                <span>Googleアカウントでログイン</span>
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 glass-effect border-b border-slate-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="selectCategory('all')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-sakura-500 flex items-center justify-center text-white font-black text-xl shadow-md transform hover:rotate-6 transition-transform">知</div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-brand-600 to-sakura-500 bg-clip-text text-transparent leading-none">高校生知恵袋</h1>
                    <span class="text-xs text-slate-500 font-medium">みんなで作る学習・生活Q&A</span>
                </div>
            </div>
            <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                <input type="text" id="search-input" onkeyup="handleSearch(event)" placeholder="教科、定期テスト、進路について検索..." class="w-full pl-10 pr-4 py-2 bg-slate-100 hover:bg-slate-200/70 focus:bg-white border border-transparent focus:border-brand-500 rounded-full text-sm outline-none transition-all">
                <i class="fa-solid font-black fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="handleAskClick()" class="hidden sm:flex items-center space-x-2 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 text-white font-bold px-4 py-2 rounded-full text-sm shadow-md transition-all">
                    <i class="fa-solid fa-pen"></i>
                    <span>質問する</span>
                </button>
                <button onclick="openProfileModal()" class="relative group p-0.5 rounded-full hover:ring-2 hover:ring-brand-500 transition-all focus:outline-none" title="プロフィール設定">
                    <img id="nav-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="User Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow">
                    <span id="nav-auth-badge" class="absolute bottom-0 right-0 w-3 h-3 bg-slate-400 border-2 border-white rounded-full"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <aside class="hidden md:block md:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">カテゴリー</h2>
                <nav class="space-y-1" id="category-list"></nav>
            </div>
        </aside>

        <section class="md:col-span-3 space-y-4">
            <div class="flex md:hidden space-x-2 overflow-x-auto pb-2 custom-scrollbar" id="mobile-category-list"></div>
            <div id="questions-container" class="space-y-4"></div>
        </section>
    </main>

    <!-- Floating Mobile Button -->
    <button onclick="handleAskClick()" class="sm:hidden fixed bottom-6 right-6 z-20 w-14 h-14 bg-gradient-to-r from-brand-600 to-sakura-500 text-white rounded-full shadow-lg flex items-center justify-center text-xl font-bold">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative">
            <button onclick="closeProfileModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <h3 class="text-xl font-extrabold text-slate-800">プロフィール設定</h3>
            </div>
            <div class="mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                <div id="google-account-status"></div>
            </div>
        </div>
    </div>

    <!-- Ask/Edit Modal -->
    <div id="ask-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative">
            <button onclick="closeAskModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 id="modal-form-title" class="text-xl font-extrabold text-slate-800 mb-4">質問を投稿する</h3>
            <form onsubmit="submitQuestion(event)" class="space-y-4">
                <input type="hidden" id="edit-question-id" value="">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">カテゴリー</label>
                    <select id="question-category" required class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm outline-none">
                        <option value="数学">数学</option>
                        <option value="英語">英語</option>
                        <option value="国語">国語</option>
                        <option value="理科">理科</option>
                        <option value="社会">社会</option>
                        <option value="学校生活・進路">学校生活・進路</option>
                        <option value="部活動">部活動</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">質問タイトル</label>
                    <input type="text" id="question-title" required placeholder="例：二次関数の最大値の求め方" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">詳しい内容</label>
                    <textarea id="question-body" required rows="4" placeholder="詳しい内容を入力..." class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm outline-none resize-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition-all">保存・送信する</button>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-20 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        const CATEGORIES = [
            { id: 'all', name: 'すべてのカテゴリー', icon: 'fa-layer-group' },
            { id: '数学', name: '数学', icon: 'fa-calculator' },
            { id: '英語', name: '英語', icon: 'fa-language' },
            { id: '国語', name: '国語', icon: 'fa-book-open' },
            { id: '理科', name: '理科', icon: 'fa-flask' },
            { id: '社会', name: '社会', icon: 'fa-earth-asia' },
            { id: '学校生活・進路', name: '学校生活・進路', icon: 'fa-school' },
            { id: '部活動', name: '部活動', icon: 'fa-baseball-bat-ball' }
        ];

        let selectedCategory = 'all';
        let searchQuery = '';

        let userProfile = {
            id: '',
            name: "ゲスト",
            email: "",
            avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Guest"
        };

        window.questions = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            renderCategories();
            renderQuestions();
            renderGoogleAccountStatus();
        });

        function renderCategories() {
            const list = document.getElementById('category-list');
            const mobileList = document.getElementById('mobile-category-list');

            if (list) {
                list.innerHTML = CATEGORIES.map(c => `
                    <button onclick="selectCategory('${c.id}')" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs font-bold transition-all ${selectedCategory === c.id ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-100'}">
                        <i class="fa-solid ${c.icon} w-4 text-center"></i>
                        <span>${c.name}</span>
                    </button>
                `).join('');
            }
            if (mobileList) {
                mobileList.innerHTML = CATEGORIES.map(c => `
                    <button onclick="selectCategory('${c.id}')" class="whitespace-nowrap px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${selectedCategory === c.id ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
                        ${c.name}
                    </button>
                `).join('');
            }
        }

        function selectCategory(id) {
            selectedCategory = id;
            renderCategories();
            renderQuestions();
        }

        function handleSearch(e) {
            searchQuery = e.target.value.toLowerCase();
            renderQuestions();
        }

        window.renderQuestions = function() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            let filtered = selectedCategory === 'all' 
                ? window.questions 
                : window.questions.filter(q => q.category === selectedCategory);

            if (searchQuery) {
                filtered = filtered.filter(q => 
                    (q.title || '').toLowerCase().includes(searchQuery) || 
                    (q.body || '').toLowerCase().includes(searchQuery)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-sm border border-slate-200">質問が見つかりませんでした。</div>';
                return;
            }

            container.innerHTML = filtered.map(q => {
                const isLiked = userProfile.email && q.likedUsers && q.likedUsers.includes(userProfile.email);
                const isAuthor = userProfile.email && q.authorEmail === userProfile.email;

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-1 rounded-md font-semibold">${q.category || '全般'}</span>
                                <span class="text-xs text-slate-400">${q.author || '匿名'}</span>
                            </div>
                            ${isAuthor ? `
                                <button onclick="openEditModal('${q.id}')" class="text-xs text-brand-600 hover:text-brand-800 font-bold px-2 py-1 bg-brand-50 rounded-lg">
                                    <i class="fa-solid fa-pen-to-square mr-1"></i>編集
                                </button>
                            ` : ''}
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg">${escapeHtml(q.title || '')}</h3>
                        <p class="text-slate-600 text-sm whitespace-pre-line">${escapeHtml(q.body || '')}</p>
                        <div class="pt-2 flex items-center gap-4 border-t border-slate-100">
                            <button onclick="toggleLike('${q.id}')" class="flex items-center gap-1.5 text-xs font-bold ${isLiked ? 'text-pink-500' : 'text-slate-400 hover:text-slate-600'} transition-colors">
                                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart text-sm"></i>
                                <span>${q.likes || 0}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        async function toggleLike(id) {
            if (!userProfile.email) {
                document.getElementById('auth-overlay').classList.remove('hidden');
                return;
            }
            const q = window.questions.find(item => item.id === id);
            if (!q) return;

            let likedUsers = q.likedUsers ? [...q.likedUsers] : [];
            const index = likedUsers.indexOf(userProfile.email);
            let newLikes = q.likes || 0;

            if (index > -1) {
                likedUsers.splice(index, 1);
                newLikes = Math.max(0, newLikes - 1);
            } else {
                likedUsers.push(userProfile.email);
                newLikes += 1;
            }

            if (window.db) {
                try {
                    const docRef = window.doc(window.db, "questions", id);
                    await window.updateDoc(docRef, {
                        likes: newLikes,
                        likedUsers: likedUsers
                    });
                } catch (e) {
                    console.error("Firestore update like error:", e);
                }
            }
        }

        function handleAskClick() {
            if (userProfile.email) {
                document.getElementById('edit-question-id').value = '';
                document.getElementById('modal-form-title').textContent = '質問を投稿する';
                document.getElementById('question-title').value = '';
                document.getElementById('question-body').value = '';
                document.getElementById('ask-modal').classList.remove('hidden');
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        }

        function openEditModal(id) {
            const q = window.questions.find(item => item.id === id);
            if (!q) return;

            document.getElementById('edit-question-id').value = q.id;
            document.getElementById('modal-form-title').textContent = '質問を編集する';
            document.getElementById('question-category').value = q.category || '数学';
            document.getElementById('question-title').value = q.title || '';
            document.getElementById('question-body').value = q.body || '';
            document.getElementById('ask-modal').classList.remove('hidden');
        }

        async function submitQuestion(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-question-id').value;
            const category = document.getElementById('question-category').value;
            const title = document.getElementById('question-title').value.trim();
            const body = document.getElementById('question-body').value.trim();

            if (!title || !body) return;

            if (window.db) {
                try {
                    if (editId) {
                        const docRef = window.doc(window.db, "questions", editId);
                        await window.updateDoc(docRef, {
                            category: category,
                            title: title,
                            body: body
                        });
                        showToast('質問を更新しました！', 'success');
                    } else {
                        await window.addDoc(window.collection(window.db, "questions"), {
                            author: userProfile.name || '高校生',
                            authorEmail: userProfile.email,
                            category: category,
                            title: title,
                            body: body,
                            likes: 0,
                            likedUsers: [],
                            createdAt: window.serverTimestamp ? window.serverTimestamp() : Date.now()
                        });
                        showToast('質問を投稿しました！', 'success');
                    }
                } catch (err) {
                    console.error("Firestore submit error:", err);
                    showToast('保存エラー: ' + err.message, 'error');
                }
            }

            closeAskModal();
        }

        function closeAuthModal() { document.getElementById('auth-overlay').classList.add('hidden'); }
        function openProfileModal() { document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }
        function closeAskModal() { document.getElementById('ask-modal').classList.add('hidden'); }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function loadUserProfile() {
            const saved = localStorage.getItem('chiebukuro_user_profile');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') userProfile = { ...userProfile, ...parsed };
                } catch (e) {}
            }
        }

        function saveUserProfile() {
            localStorage.setItem('chiebukuro_user_profile', JSON.stringify(userProfile));
        }

        window.signInWithGoogle = async function() {
            try {
                if (window.auth && window.GoogleAuthProviderClass) {
                    const provider = new window.GoogleAuthProviderClass();
                    try {
                        await window.signInWithPopupFunc(window.auth, provider);
                    } catch (err) {
                        await window.signInWithRedirectFunc(window.auth, provider);
                    }
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        };

        window.signOutAccount = async function() {
            if (window.auth && window.signOutFunc) {
                await window.signOutFunc(window.auth);
                window.onSignOutSuccess();
            }
        };

        window.onGoogleSignInSuccess = function(user) {
            userProfile.email = user.email || "";
            userProfile.name = user.displayName || userProfile.name;
            userProfile.avatarUrl = user.photoURL || userProfile.avatarUrl;

            saveUserProfile();
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('nav-avatar').src = userProfile.avatarUrl;
            document.getElementById('nav-auth-badge').className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full";
            renderGoogleAccountStatus();
            renderQuestions();
            showToast('ログインしました！', 'success');
        };

        window.onSignOutSuccess = function() {
            userProfile.email = "";
            saveUserProfile();
            document.getElementById('nav-avatar').src = "https://api.dicebear.com/7.x/bottts/svg?seed=Guest";
            document.getElementById('nav-auth-badge').className = "absolute bottom-0 right-0 w-3 h-3 bg-slate-400 border-2 border-white rounded-full";
            renderGoogleAccountStatus();
            renderQuestions();
            showToast('ログアウトしました', 'info');
        };

        function renderGoogleAccountStatus() {
            const container = document.getElementById('google-account-status');
            if (!container) return;

            if (userProfile.email) {
                container.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-slate-800">Google連携中</div>
                            <div class="text-[11px] text-slate-500">${userProfile.email}</div>
                        </div>
                        <button onclick="window.signOutAccount()" class="px-3 py-1.5 bg-slate-200 text-xs font-bold rounded-xl hover:bg-slate-300">ログアウト</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="text-left">
                            <div class="text-xs font-bold text-slate-800">未サインイン</div>
                            <div class="text-[11px] text-slate-500">Googleアカウントでログイン</div>
                        </div>
                        <button onclick="window.signInWithGoogle()" class="flex items-center space-x-2 px-3.5 py-2 bg-white border text-xs font-bold rounded-xl hover:bg-slate-50">
                            <i class="fa-brands fa-google text-red-500"></i>
                            <span>ログイン</span>
                        </button>
                    </div>
                `;
            }
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl text-xs font-bold text-white shadow-lg pointer-events-auto transition-all transform translate-y-2 ${type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-slate-700'}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
